name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [dev, master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :uhabits-android:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: loop-habit-tracker-apk
          path: uhabits-android/build/outputs/apk/debug/*.apk
